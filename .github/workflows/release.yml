name: Release

# Post-merge pipeline.
#
#   push to main  -> build and publish a container image tagged with the commit
#   push to main whose VERSION has no tag yet (PET-92)
#                 -> same, plus tag the commit vX.Y.Z and cut a GitHub Release
#                    carrying the two files clusterctl needs to install this
#                    provider. This is the normal way to release: a PR that
#                    changes VERSION (make bump-patch|minor|major).
#   push of a tag -> the same release, from a tag pushed by hand (fallback)
#
# Deliberately does NOT run on pull_request: a PR must never be able to publish
# an image or a release.
on:
  push:
    branches: [main]
    tags: ['v*']

# One group for every release run, main pushes and tag pushes alike, so a
# hand-pushed tag can never overlap a main run releasing the same version and
# publish over it. GitHub keeps one pending run per group: a newer push
# replaces a queued (never a running) one. A replaced main run is harmless,
# the next one sees the same untagged VERSION; a replaced tag run is not,
# see "Fallback: tagging by hand" in docs/releasing.md.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # Decides whether this run releases, and as which tag. A tag the release job
  # creates with GITHUB_TOKEN does not start another workflow run, so the
  # main-push path cannot release twice. Runs on main are serialised by the
  # concurrency group, so the next run sees the tag this one created.
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      invalid: ${{ steps.v.outputs.invalid }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the existing tags decide whether VERSION is released

      # Main path, VERSION = vX.Y.Z:
      #   tag absent, VERSION releasable      -> release
      #   tag absent, VERSION not releasable  -> sha image only, run fails at the end
      #   tag on this commit, no Release      -> release (finishes a half-done one)
      #   tag present, Release exists         -> sha image only
      #   tag on another commit, no Release   -> sha image only, warning (recover by hand)
      - name: Resolve
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          out() { { echo "release=$1"; echo "tag=$2"; echo "invalid=${3:-false}"; } >> "$GITHUB_OUTPUT"; }
          if [ "$REF_TYPE" = "tag" ]; then
            # Runs are serialised, so an existing Release is finished work
            # (usually the main run's, for the same version): never publish
            # over it.
            if gh release view "$REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::warning::$REF_NAME is already released; publishing the commit image only"
              out false "$REF_NAME"
            else
              echo "Tag push: releasing $REF_NAME"
              out true "$REF_NAME"
            fi
            exit 0
          fi
          if ! v="$(hack/version.sh get)"; then
            echo "::error::VERSION is unreadable; publishing the commit image only, and failing the run"
            out false "" true
            exit 0
          fi
          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag is released; publishing the commit image only"
              out false "$tag"
            elif [ "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" ]; then
              echo "::warning::$tag names this commit but has no GitHub Release; finishing the release"
              out true "$tag"
            else
              echo "::warning::$tag has no GitHub Release and names another commit; see 'Recovering a release' in docs/releasing.md"
              out false "$tag"
            fi
          elif ! hack/version.sh check; then
            echo "::error::VERSION is not releasable; publishing the commit image only, and failing the run"
            out false "$tag" true
          else
            echo "::notice::VERSION is untagged; releasing $tag from $GITHUB_SHA"
            out true "$tag"
          fi

  # Publishing must not depend on the PR workflows. They are scoped to
  # branches: [main] and so do not run for tag pushes at all, and on main they
  # run concurrently with this one -- either way an unverified commit could
  # reach ghcr.io or a GitHub Release. Re-run the checks here and gate on them.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Generated files are current
        run: |
          make generate manifests
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale; refusing to publish."
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      # The etcd-backup image is published too, and it is the tool that
      # deletes backups: its tests gate publishing like the manager's.
      - name: etcd-backup tests
        run: make test-etcd-backup

  publish:
    name: Build and publish
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release on a tag
      packages: write   # required to push to ghcr.io
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # ghcr.io requires a lowercase path, and the org is 'Petatron'.
      # A release is published under its version tag; every other run under
      # the commit. A release from main also gets the commit tag, below.
      - name: Resolve image reference
        id: img
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          repo_lc="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha_tag="sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          if [ "$RELEASE" = "true" ]; then tag="$TAG"; else tag="$sha_tag"; fi
          {
            echo "image=ghcr.io/${repo_lc}:${tag}"
            echo "sha_image=ghcr.io/${repo_lc}:${sha_tag}"
            echo "backup_image=ghcr.io/${repo_lc}-etcd-backup:${tag}"
            echo "backup_sha_image=ghcr.io/${repo_lc}-etcd-backup:${sha_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ghcr.io/${repo_lc}:${tag}"

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # On the main path the tag is created FIRST and is the lock: once it
      # names a commit, only that commit can produce the release (the version
      # job finishes a half-done one on re-run), and a hand-pushed tag on
      # another commit fails here before any vX.Y.Z image is pushed.
      # Annotated, like a hand-made `git tag -a`. Idempotent for this commit;
      # a tag that names a different commit is an error, never moved.
      # `existed` says whether an earlier attempt for this commit made it.
      - name: Tag the release commit
        id: tag
        if: needs.version.outputs.release == 'true' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
            obj="$(echo "$ref" | jq -r .object.sha)"
            if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
              obj="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq .object.sha)"
            fi
            [ "$obj" = "$GITHUB_SHA" ] || { echo "::error::$TAG already names $obj, not $GITHUB_SHA"; exit 1; }
            echo "existed=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already names $GITHUB_SHA"
            exit 0
          fi
          tag_obj="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_obj" >/dev/null
          echo "existed=false" >> "$GITHUB_OUTPUT"
          echo "Tagged $GITHUB_SHA as $TAG"

      # Release images are reused only on a re-run for the commit the tag
      # already named before this job: then a vX.Y.Z image can only have come
      # from an earlier attempt at this commit, and rebuilding would change a
      # digest. When this run just created the tag (first attempt, or after
      # the tag was deleted to release from a newer commit), any existing
      # vX.Y.Z image may be another commit's and is rebuilt over; no Release
      # exists yet on that path, so no published digest moves. Only "not
      # found" counts as absent: any other registry error fails the step,
      # so a blip cannot push a new digest over a tag that is already there.
      - name: Find release images already published
        id: have
        if: steps.tag.outputs.existed == 'true'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          BACKUP_IMAGE: ${{ steps.img.outputs.backup_image }}
        run: |
          for pair in "manager=$IMAGE" "backup=$BACKUP_IMAGE"; do
            name="${pair%%=*}" ref="${pair#*=}"
            if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "$ref already published; reusing it"
            elif echo "$out" | grep -qiE 'not found|manifest unknown'; then
              echo "$ref not published yet"
            else
              echo "::error::cannot tell whether $ref exists: $out"
              exit 1
            fi
          done

      # amd64 and arm64 in one manifest list. The temporary management cluster
      # `hydra bootstrap` creates is a kind cluster on the operator's machine,
      # often Apple Silicon, where an amd64-only image fails with "no matching
      # manifest". The Dockerfile cross-compiles on the build platform and its
      # final stage has no RUN, so no emulation is needed.
      - name: Build and push the multi-arch image
        if: steps.have.outputs.manager != 'true'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: make docker-buildx IMG="$IMAGE" PLATFORMS=linux/amd64,linux/arm64

      # Keeps the sha-<12 hex> image every main commit has, for a release
      # commit too. A copy of the manifest list, not a rebuild.
      - name: Also tag a release from main by its commit
        if: needs.version.outputs.release == 'true' && github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          SHA_IMAGE: ${{ steps.img.outputs.sha_image }}
        run: docker buildx imagetools create -t "$SHA_IMAGE" "$IMAGE"

      # Same tag as the manager image, under a sibling name, so one merge sha
      # names both. Before the Release, on purpose: once the Release exists a
      # "Re-run all jobs" treats the version as done, so everything a release
      # publishes must already be there. A backup-image failure therefore
      # holds the Release back; re-running finishes it (the tag is the lock).
      - name: Build and push the etcd-backup image
        if: steps.have.outputs.backup != 'true'
        env:
          BACKUP_IMAGE: ${{ steps.img.outputs.backup_image }}
        run: |
          make docker-build-etcd-backup
          docker run --rm --entrypoint sh -v "$PWD/tools/etcd-backup:/t:ro" etcd-backup:dev /t/etcd-backup_test.sh
          docker tag etcd-backup:dev "$BACKUP_IMAGE"
          make docker-push-etcd-backup ETCD_BACKUP_IMG="$BACKUP_IMAGE"
          echo "Published $BACKUP_IMAGE"

      - name: Also tag the release's etcd-backup image by its commit
        if: needs.version.outputs.release == 'true' && github.ref_type != 'tag'
        env:
          BACKUP_IMAGE: ${{ steps.img.outputs.backup_image }}
          BACKUP_SHA_IMAGE: ${{ steps.img.outputs.backup_sha_image }}
        run: docker buildx imagetools create -t "$BACKUP_SHA_IMAGE" "$BACKUP_IMAGE"

      # The release manifest must reference the image just published, not the
      # placeholder in config/manager. release-manifests takes IMG for this.
      - name: Build clusterctl release manifests
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: make release-manifests IMG="$IMAGE"

      - name: Upload release manifests as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifests-${{ needs.version.outputs.release == 'true' && needs.version.outputs.tag || github.ref_name }}
          path: |
            out/infrastructure-components.yaml
            out/metadata.yaml
          if-no-files-found: error

      # The last publishing step, so a Release only exists once everything
      # else has been published. If an earlier attempt created the Release
      # but failed attaching assets, "Re-run failed jobs" lands here again
      # and re-uploads them; "Re-run all jobs" does not (see the version job).
      - name: Create GitHub Release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          assets=(out/infrastructure-components.yaml out/metadata.yaml)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber -R "$GITHUB_REPOSITORY"
            echo "$TAG already existed; assets re-uploaded"
            exit 0
          fi
          # A tag with a "-" (v0.3.0-rc.1) is a pre-release.
          set -- --title "$TAG" --generate-notes --verify-tag -R "$GITHUB_REPOSITORY"
          case "$TAG" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$TAG" "${assets[@]}" "$@"

      # The commit image above is published even when VERSION is broken, so
      # main never loses its sha- images; the run still goes red.
      - name: Fail on an unreleasable VERSION
        if: needs.version.outputs.invalid == 'true'
        run: |
          echo "::error::VERSION on main is not releasable; see the version job, and fix it in a PR (make check-version)"
          exit 1
