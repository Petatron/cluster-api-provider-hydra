name: Vulnerabilities

# govulncheck reports only vulnerabilities in code the provider actually calls,
# in its dependencies and in the Go standard library it is built with. The
# standard-library half depends on the toolchain, so this runs under the same
# go.mod-pinned Go as every other job.
#
# The weekly run catches advisories published after the last merge: a new
# vulnerability needs no code change here to make main vulnerable.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: make vuln
