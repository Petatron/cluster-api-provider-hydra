name: Lint

# Runs on every PR, and on main after merge. Deliberately NOT on every push to
# every branch: that made each PR run the whole suite twice, once for the branch
# push and once for the PR.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the previous run for that PR. main is never
# cancelled, so post-merge results are always recorded.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint
