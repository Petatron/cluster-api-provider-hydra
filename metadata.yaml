# Maps this provider's release series to the Cluster API contract version it
# implements. clusterctl reads this to decide whether a provider release is
# compatible with the installed Cluster API core version.
#
# Contract v1beta2 corresponds to Cluster API v1.14.x.
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
releaseSeries:
  - major: 0
    minor: 1
    contract: v1beta2
