---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hydraclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: HydraCluster
    listKind: HydraClusterList
    plural: hydraclusters
    singular: hydracluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether cluster infrastructure has been verified
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.storagePool
      name: Pool
      priority: 1
      type: string
    - jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HydraCluster is the Schema for the hydraclusters API.

          It is referenced by a Cluster's spec.infrastructureRef, which is what makes
          the Cluster admissible at all: Cluster API rejects a Cluster carrying none of
          infrastructureRef, controlPlaneRef or topology.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HydraCluster
            properties:
              baseImage:
                description: |-
                  baseImage is the image machines in this cluster boot from when they do not
                  name one of their own.

                  Empty falls back to the manager's --libvirt-base-image flag.
                properties:
                  checksum:
                    description: |-
                      checksum verifies a fetched image, in the form "<algorithm>:<hex>".

                      The digest length is pinned to the algorithm -- 64 hex characters for
                      sha256, 128 for sha512 -- so a truncated or malformed digest is rejected at
                      admission rather than discovered halfway through provisioning a machine.

                      Only valid alongside url; a checksum with nothing to verify is rejected.
                    pattern: ^(sha256:[a-fA-F0-9]{64}|sha512:[a-fA-F0-9]{128})$
                    type: string
                  name:
                    description: name identifies a base image already known to the
                      backend.
                    maxLength: 253
                    minLength: 1
                    type: string
                  url:
                    description: |-
                      url is where the backend may fetch the image from when it does not already
                      hold one matching name.
                    maxLength: 2048
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: one of name or url must be set
                  rule: has(self.name) || has(self.url)
                - message: checksum is only meaningful alongside url
                  rule: '!has(self.checksum) || has(self.url)'
              controlPlaneEndpoint:
                description: |-
                  controlPlaneEndpoint is the address and port of this cluster's API server.

                  Cluster API reads it to populate the Cluster's own endpoint. Providers that
                  create the endpoint themselves -- with a load balancer or a VIP -- are
                  expected to fill it in. Hydra creates neither, so this is supplied by
                  whoever writes the object, and the provider only reports it back.

                  Immutable once set. Moving a live cluster's API endpoint is not something
                  a reconcile can carry out; it is a new cluster.

                  NOTE: this field is part of the Cluster API contract.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: controlPlaneEndpoint.host is immutable once set
                  rule: '!has(oldSelf.host) || (has(self.host) && self.host == oldSelf.host)'
                - message: controlPlaneEndpoint.port is immutable once set
                  rule: '!has(oldSelf.port) || (has(self.port) && self.port == oldSelf.port)'
              networks:
                description: |-
                  networks are the network attachments machines in this cluster receive when
                  they do not name any of their own.

                  There is no fallback for this one. A machine with no network attachment
                  boots and can never reach an API server, so provisioning is refused rather
                  than producing something that looks healthy to the backend and is useless.
                items:
                  description: HydraNetworkAttachment attaches a machine to one backend
                    network.
                  properties:
                    name:
                      description: |-
                        name is the backend network or bridge to attach to, for example "br0".
                        Hydra does not interpret this value; it is passed to the backend, which
                        decides what it means.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 8
                type: array
              storagePool:
                description: |-
                  storagePool is the backend storage pool this cluster's machine disks are
                  created in, and where its base image is expected to live.

                  Cluster-scoped on purpose, with no per-machine override. A pool per machine
                  is the arrangement found on the reference hardware -- one pool each for
                  three hand-built VMs -- and it is precisely the shape this provider cannot
                  use, because it resolves the base image as a volume *inside* the configured
                  pool. One pool per cluster keeps a single place the image can be.

                  Empty falls back to the manager's --libvirt-storage-pool flag.
                maxLength: 253
                minLength: 1
                type: string
            type: object
          status:
            description: status defines the observed state of HydraCluster
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the HydraCluster resource.

                  A condition of type "Ready" is mirrored into the Cluster's
                  InfrastructureReady condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  initialization reports whether the cluster's infrastructure is ready.

                  NOTE: this field is part of the Cluster API contract.
                properties:
                  provisioned:
                    description: |-
                      provisioned reports that the cluster-scoped infrastructure this provider
                      depends on has been verified.

                      Cluster API reads this to populate the Cluster's
                      status.initialization.infrastructureProvisioned, which gates machine
                      creation. Until it is true, no HydraMachine in this cluster is created.

                      NOTE: this field is part of the Cluster API contract.
                    type: boolean
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
