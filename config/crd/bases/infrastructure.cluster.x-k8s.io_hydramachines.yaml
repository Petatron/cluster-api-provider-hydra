---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hydramachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: HydraMachine
    listKind: HydraMachineList
    plural: hydramachines
    singular: hydramachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether the backing infrastructure is fully provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Machine readiness across its lifecycle
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HydraMachine is the Schema for the hydramachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HydraMachine
            properties:
              diskSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  diskSize is the size of the machine's root disk, as a Kubernetes quantity,
                  for example "40Gi".
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: diskSize is immutable; replace the machine instead
                  rule: self == oldSelf
              image:
                description: image is the base image the machine boots from.
                properties:
                  checksum:
                    description: |-
                      checksum verifies a fetched image, in the form "<algorithm>:<hex>".

                      The digest length is pinned to the algorithm -- 64 hex characters for
                      sha256, 128 for sha512 -- so a truncated or malformed digest is rejected at
                      admission rather than discovered halfway through provisioning a machine.

                      Only valid alongside url; a checksum with nothing to verify is rejected.
                    pattern: ^(sha256:[a-fA-F0-9]{64}|sha512:[a-fA-F0-9]{128})$
                    type: string
                  name:
                    description: name identifies a base image already known to the
                      backend.
                    maxLength: 253
                    minLength: 1
                    type: string
                  url:
                    description: |-
                      url is where the backend may fetch the image from when it does not already
                      hold one matching name.
                    maxLength: 2048
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: image is immutable; replace the machine instead
                  rule: self == oldSelf
                - message: one of name or url must be set
                  rule: has(self.name) || has(self.url)
                - message: checksum is only meaningful alongside url
                  rule: '!has(self.checksum) || has(self.url)'
              memory:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  memory is the RAM the machine is given, as a Kubernetes quantity, for
                  example "8Gi".
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: memory is immutable; replace the machine instead
                  rule: self == oldSelf
              networks:
                description: |-
                  networks are the backend networks this machine attaches to, in order. The
                  first attachment provides the machine's primary address.

                  A list rather than a single value so that multi-homed machines do not
                  require an API break later.
                items:
                  description: HydraMachineNetworkAttachment attaches a machine to
                    one backend network.
                  properties:
                    name:
                      description: |-
                        name is the backend network or bridge to attach to, for example "br0".
                        Hydra does not interpret this value; it is passed to the backend, which
                        decides what it means.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: networks are immutable; replace the machine instead
                  rule: self == oldSelf
              providerID:
                description: |-
                  providerID is the unique identifier for this machine, in the form
                  hydra://<backend>/<id>. The controller sets it once the backing
                  infrastructure exists; the Kubernetes Node reports the same value, which is
                  how Cluster API pairs a Machine with its Node.

                  This is written by the controller, not by users. It is immutable once set.

                  NOTE: this field is part of the Cluster API contract.
                maxLength: 512
                minLength: 1
                type: string
              vcpus:
                description: vcpus is the number of virtual CPUs the machine is given.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: vcpus is immutable; replace the machine instead
                  rule: self == oldSelf
            required:
            - diskSize
            - image
            - memory
            - networks
            - vcpus
            type: object
            x-kubernetes-validations:
            - message: providerID is immutable once set
              rule: '!has(oldSelf.providerID) || (has(self.providerID) && self.providerID
                == oldSelf.providerID)'
          status:
            description: status defines the observed state of HydraMachine
            properties:
              addresses:
                description: |-
                  addresses are the addresses assigned to the machine. Cluster API surfaces
                  these on the Machine once initialization completes. They are not used to
                  drive any behaviour -- they exist so an operator debugging a stuck machine
                  can see where it actually landed.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                maxItems: 32
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the HydraMachine resource.

                  A condition of type "Ready" is mirrored into the Machine's
                  InfrastructureReady condition, and is expected to describe the machine
                  across its whole lifecycle -- provisioning, steady state, and deletion --
                  not just whether provisioning finished once.

                  Terminal failures are reported here too. The v1beta2 contract has no
                  special handling for them, so a well-documented condition type is the only
                  signal consumers get.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: |-
                  failureDomain is the failure domain the machine was actually placed in.

                  Placement is requested at Machine level, not here; this field reports where
                  the backend put it, which is not necessarily the same thing.
                maxLength: 256
                minLength: 1
                type: string
              initialization:
                description: |-
                  initialization reports whether the machine's infrastructure is provisioned.

                  NOTE: this field is part of the Cluster API contract.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure backing this machine is fully
                      provisioned and the machine is ready to be bootstrapped.

                      Cluster API reads this to populate the Machine's
                      status.initialization.infrastructureProvisioned, which is what actually
                      drives provisioning orchestration. Without it, Cluster API cannot observe
                      that this provider finished its work.

                      NOTE: this field is part of the Cluster API contract.
                    type: boolean
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
