                        type: object
                    type: object
                  spec:
                    description: |-
                      spec is the HydraMachine spec applied to machines cloned from this
                      template.

                      providerID must not be set here. It identifies one specific machine, and a
                      template describes many; a value here would be copied into every clone and
                      collide immediately.
                    properties:
                      diskSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          diskSize is the size of the machine's root disk, as a Kubernetes quantity,
                          for example "40Gi". Must be greater than zero, for the same reason as
                          memory.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                        x-kubernetes-validations:
                        - message: diskSize is immutable; replace the machine instead
                          rule: self == oldSelf
                        - message: diskSize must be greater than zero
                          rule: quantity(self).isGreaterThan(quantity('0'))
                      image:
                        description: |-
                          image is the base image the machine boots from.

                          Optional since the owning HydraCluster can supply a default. Omitting it
                          resolves in order: this field, then the cluster's baseImage, then the
                          manager's --libvirt-base-image flag. It is only an error when all three are
                          empty.

                          Immutability is expressed on the spec rather than the field, because a
                          field-level transition rule cannot describe "may be set once, then never
                          changed" for an optional value.
                        properties:
                          checksum:
                            description: |-
                              checksum verifies a fetched image, in the form "<algorithm>:<hex>".

                              The digest length is pinned to the algorithm -- 64 hex characters for
                              sha256, 128 for sha512 -- so a truncated or malformed digest is rejected at
                              admission rather than discovered halfway through provisioning a machine.

                              Only valid alongside url; a checksum with nothing to verify is rejected.
                            pattern: ^(sha256:[a-fA-F0-9]{64}|sha512:[a-fA-F0-9]{128})$
                            type: string
                          name:
                            description: name identifies a base image already known
                              to the backend.
                            maxLength: 253
                            minLength: 1
                            type: string
                          url:
                            description: |-
                              url is where the backend may fetch the image from when it does not already
                              hold one matching name.
                            maxLength: 2048
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: one of name or url must be set
                          rule: has(self.name) || has(self.url)
                        - message: checksum is only meaningful alongside url
                          rule: '!has(self.checksum) || has(self.url)'
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          memory is the RAM the machine is given, as a Kubernetes quantity, for
                          example "8Gi". Must be greater than zero -- a zero or negative value would
                          otherwise reach libvirt as domain XML, and because this field is immutable
                          the resulting object could never be corrected, only deleted.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
