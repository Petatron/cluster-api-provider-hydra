              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HydraMachineTemplate
            properties:
              template:
                description: template is the machine payload cloned into each HydraMachine.
                properties:
                  metadata:
                    description: |-
                      metadata is the object metadata applied to machines cloned from this
                      template.
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
