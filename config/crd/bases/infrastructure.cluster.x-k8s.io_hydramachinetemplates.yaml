                        x-kubernetes-validations:
                        - message: memory is immutable; replace the machine instead
                          rule: self == oldSelf
                        - message: memory must be greater than zero
                          rule: quantity(self).isGreaterThan(quantity('0'))
                      networks:
                        description: |-
                          networks are the backend networks this machine attaches to, in order. The
                          first attachment provides the machine's primary address.

                          A list rather than a single value so that multi-homed machines do not
                          require an API break later.

                          Optional for the same reason as image: the owning HydraCluster can supply
                          defaults. Unlike image there is no manager-flag fallback, and a machine
                          that resolves to no networks is refused -- it would boot, satisfy the
                          backend, and never reach an API server.
                        items:
                          description: HydraNetworkAttachment attaches a machine to
                            one backend network.
                          properties:
                            name:
                              description: |-
                                name is the backend network or bridge to attach to, for example "br0".
                                Hydra does not interpret this value; it is passed to the backend, which
                                decides what it means.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 8
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      providerID:
                        description: |-
                          providerID is the unique identifier for this machine, in the form
                          hydra://<backend>/<id>. The controller sets it once the backing
                          infrastructure exists; the Kubernetes Node reports the same value, which is
                          how Cluster API pairs a Machine with its Node.

                          This is written by the controller, not by users. It is immutable once set.

                          NOTE: this field is part of the Cluster API contract.
                        maxLength: 512
                        minLength: 1
                        type: string
                      vcpus:
                        description: vcpus is the number of virtual CPUs the machine
                          is given.
                        format: int32
                        minimum: 1
                        type: integer
                        x-kubernetes-validations:
                        - message: vcpus is immutable; replace the machine instead
                          rule: self == oldSelf
                    required:
                    - diskSize
                    - memory
                    - vcpus
                    type: object
                    x-kubernetes-validations:
                    - message: providerID must not be set on a template; it identifies
                        a single machine
                      rule: '!has(self.providerID)'
                    - message: providerID is immutable once set
                      rule: '!has(oldSelf.providerID) || (has(self.providerID) &&
                        self.providerID == oldSelf.providerID)'
                    - message: image is immutable once set; replace the machine instead
                      rule: '!has(oldSelf.image) || (has(self.image) && self.image
                        == oldSelf.image)'
                    - message: networks are immutable once set; replace the machine
                        instead
                      rule: '!has(oldSelf.networks) || (has(self.networks) && self.networks
                        == oldSelf.networks)'
                required:
                - spec
                type: object
            required:
            - template
            type: object
            x-kubernetes-validations:
            - message: HydraMachineTemplate spec is immutable; create a new template
                and roll the MachineDeployment onto it
              rule: self == oldSelf
          status:
            description: status defines the observed state of HydraMachineTemplate
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the HydraMachineTemplate
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
