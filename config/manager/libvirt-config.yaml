# Backend configuration for the Hydra provider.
#
# These values are site-specific -- they name a storage pool and a base image on
# your hypervisor -- so there is no correct default. Edit them before deploying.
#
# The manager fails fast on startup if the pool or base image is unset. That is
# deliberate: a provider that guessed where to put machine disks would be far
# worse than one that refuses to start with a clear message in its logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: libvirt-config
data:
  # libvirt connection URI.
  uri: "qemu:///system"

  # host:port of a remote libvirt daemon.
  #
  # REQUIRED for the in-cluster deployment. Leaving it empty selects the local
  # socket at /var/run/libvirt/libvirt-sock, which the manager pod does not have:
  # nothing mounts it, so the manager fails at startup. Local-socket mode is for
  # `make run` outside the cluster, or for a pod deliberately pinned to the
  # hypervisor with the socket mounted -- see the commented block in manager.yaml.
  #
  # Preferring a remote address is also the honest default: per architectural
  # principle 9, the controller must not assume it shares a host with the
  # hypervisor.
  remoteAddr: ""

  # Storage pool that machine disks are created in. REQUIRED.
  storagePool: ""

  # Volume name of the base image machines are cloned from. REQUIRED.
  # Used when a HydraMachine does not name its own image.
  baseImage: ""
