apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-hydra
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-hydra
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-api-provider-hydra
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cluster-api-provider-hydra
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --libvirt-uri=$(LIBVIRT_URI)
          - --libvirt-remote-addr=$(LIBVIRT_REMOTE_ADDR)
          - --libvirt-insecure=$(LIBVIRT_INSECURE)
          - --libvirt-pki-path=$(LIBVIRT_PKI_PATH)
          - --libvirt-storage-pool=$(LIBVIRT_STORAGE_POOL)
          - --libvirt-base-image=$(LIBVIRT_BASE_IMAGE)
        env:
          # Sourced from the libvirt-config ConfigMap, which must be edited before
          # deploying: storagePool and baseImage are site-specific and have no
          # sensible default.
          - name: LIBVIRT_URI
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: uri}
          - name: LIBVIRT_REMOTE_ADDR
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: remoteAddr}
          - name: LIBVIRT_INSECURE
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: insecure}
          - name: LIBVIRT_PKI_PATH
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: pkiPath}
          - name: LIBVIRT_STORAGE_POOL
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: storagePool}
          - name: LIBVIRT_BASE_IMAGE
            valueFrom:
              configMapKeyRef: {name: libvirt-config, key: baseImage}
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            # A memory-backed emptyDir is charged to the container's memory
            # allowance, so the /tmp mount above has to fit inside this number
            # alongside the manager itself.
            cpu: 500m
            memory: 192Mi
          requests:
            cpu: 10m
            memory: 64Mi
        # Add to this list -- do not introduce a second volumeMounts key, which
        # YAML parsers may ignore in favour of this one.
        volumeMounts:
          # Required, not optional. The root filesystem is read-only, and
          # rendering a machine's cloud-init image stages it through a temporary
          # directory; without somewhere writable the manager cannot provision
          # any machine that has bootstrap data.
          - name: tmp
            mountPath: /tmp
        # [REMOTE-TLS] Add:
        #   - name: libvirt-pki
        #     mountPath: /etc/pki/libvirt
        #     readOnly: true
        # [LOCAL-LIBVIRT] To drive libvirt over the host's local socket instead
        # of a remote address, add the entries below and pin the pod to the
        # hypervisor node with a nodeSelector. Add, not replace -- the tmp mount
        # above is required in every configuration.
        # Without the mount the socket does not exist inside the pod and the
        # manager fails at startup; without the pin it may land on a node that
        # has no libvirt at all. A remote address avoids both problems and does
        # not assume the controller shares a host with the hypervisor.
        #   - name: libvirt-sock
        #     mountPath: /var/run/libvirt/libvirt-sock
        #
        # MOUNT AT /var/run, EVEN THOUGH THE HOST PATH BELOW IS /run. The two
        # are the same file on the host, because /var/run is a symlink to /run
        # -- but not inside this container, which has no such symlink. The
        # client dials /var/run/libvirt/libvirt-sock, so a mount at /run leaves
        # it dialling a path that does not exist, and the error reads "no such
        # file or directory" as though the socket were missing rather than
        # mounted elsewhere. An earlier revision of this comment "corrected"
        # these two paths to match; they are deliberately different.
        #
        # THE MOUNT ALONE IS NOT ENOUGH -- two separate things are also needed,
        # both on the pod-level securityContext further down:
        #
        #   securityContext:
        #     runAsNonRoot: true
        #     runAsUser: <a uid that exists on the hypervisor>
        #     supplementalGroups: [<the hypervisor's libvirt gid>]
        #
        # 1. The group, because the socket is srw-rw---- root:libvirt. Without
        #    it the socket is mounted, visible and unopenable, and libvirt
        #    reports that as a connection problem rather than a permission one.
        #
        # 2. The uid, which is the less obvious one. libvirtd resolves the
        #    connecting peer's uid to a HOST user record -- even when
        #    auth_unix_rw is "none". The image's default uid 65532 exists only
        #    inside the container, so the lookup fails and the connection is
        #    refused with "Failed to find user record for uid '65532'". Run as
        #    a uid the hypervisor knows.
        #
        # Neither value is portable. Read them on the host rather than copying:
        #   getent group libvirt | cut -d: -f3
        #   id -u <the account that administers libvirt there>
        #
        # Verified 2026-09-03 on hycluster-worker-0. This coupling of pod
        # identity to a host account is a real cost of the local-socket path,
        # and one the TLS path removes -- TLS identifies a client by
        # certificate, not by uid.
      # Add to this list -- do not introduce a second volumes key.
      volumes:
        # Memory-backed on purpose. What is staged here is a machine's
        # cloud-init user-data, which carries a live cluster join token, and a
        # tmpfs keeps it off any disk -- including the node's. The size limit is
        # far above a real image (a few hundred kilobytes) and bounded so a
        # runaway cannot consume the pod's whole memory allowance.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      # [REMOTE-TLS] Companion to the PKI mount above:
      #   - name: libvirt-pki
      #     secret:
      #       secretName: libvirt-pki
      # [LOCAL-LIBVIRT] Companion to the socket mount above.
      # /run here and /var/run there, deliberately: this path is resolved on the
      # host, where /run is where the socket actually lives.
      #   - name: libvirt-sock
      #     hostPath:
      #       path: /run/libvirt/libvirt-sock
      #       type: Socket
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
