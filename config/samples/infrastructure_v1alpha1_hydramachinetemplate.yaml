apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HydraMachineTemplate
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-hydra
    app.kubernetes.io/managed-by: kustomize
  name: hydramachinetemplate-sample
spec:
  # spec.template.spec is the subtree Cluster API clones verbatim into each
  # HydraMachine a MachineDeployment stamps out. The whole spec is immutable:
  # changing a machine shape means a new template and a rollout.
  template:
    spec:
      vcpus: 4
      memory: 8Gi
      diskSize: 60Gi
      image:
        name: ubuntu-24.04
      networks:
        - name: br0
